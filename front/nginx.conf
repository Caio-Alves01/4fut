server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chamadas da API vão para o container "api"
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # O Caddy (na frente) já manda o IP real do visitante e o protocolo (https).
        # Repassa os dois como vieram; se acrescentasse o IP do Caddy, a API veria
        # todo mundo com o mesmo IP e o limite de requisições bloquearia todos juntos.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Qualquer outra rota cai no index.html (app React)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
